name: Refresh and publish Signal Desk

on:
  push:
    branches: [main]
  schedule:
    # 10:00 AM and 6:00 PM Asia/Kolkata every day (04:30 and 12:30 UTC).
    - cron: "30 4,12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: signal-desk-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the dashboard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector dependencies
        run: pip install -r requirements.txt

      - name: Refresh scheduled or manually requested data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python export_static.py --refresh

      - name: Export the existing data for a normal code deployment
        if: github.event_name == 'push'
        run: python export_static.py

      - name: Save refreshed article history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.db site/data/articles.json
          git diff --cached --quiet || git commit -m "chore: refresh dashboard articles"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
